services:
  aftertouch:
    image: ghcr.io/gesellix/bose-soundtouch:latest
    container_name: aftertouch
    network_mode: host
    environment:
      - PORT=${AFTERTOUCH_HTTP_PORT:-8091}
      - HTTPS_PORT=${AFTERTOUCH_HTTPS_PORT:-8444}
      - SERVER_URL=http://${SERVICE_HOST:?Run scripts/setup.py first}:${AFTERTOUCH_HTTP_PORT:-8091}
      - HTTPS_SERVER_URL=https://${SERVICE_HOST:?Run scripts/setup.py first}:${AFTERTOUCH_HTTPS_PORT:-8444}
      - DATA_DIR=/app/data
    volumes:
      - aftertouch_data:/app/data
    restart: unless-stopped

  preset-proxy:
    build:
      context: ./preset-proxy
    container_name: preset-proxy
    ports:
      - "${PROXY_PORT:-8092}:8092"
    environment:
      - LISTEN_ADDR=0.0.0.0
      - LISTEN_PORT=8092
      - BASE_URL=http://${SERVICE_HOST:?Run scripts/setup.py first}:${PROXY_PORT:-8092}
      - SPEAKER_IP=${SPEAKER_IP:?Run scripts/setup.py first}
      - BUFFER_SECONDS=${BUFFER_SECONDS:-3}
      - BITRATE_KBPS=${BITRATE_KBPS:-128}
      - RECONNECT_BACKOFF_MS=${RECONNECT_BACKOFF_MS:-250,500,1000,2000,3000}
      - LOG_STREAM_CHUNKS=${LOG_STREAM_CHUNKS:-0}
    volumes:
      - preset_proxy_data:/data
    restart: unless-stopped

volumes:
  aftertouch_data:
  preset_proxy_data:
