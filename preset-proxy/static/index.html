<!DOCTYPE html>
<html lang="de" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundTouch Preset-Proxy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a14;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #2a2a3a;
            position: relative;
        }
        h1 {
            font-size: 24px;
            font-weight: 500;
            color: #00a8e0;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #888;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .settings-menu {
            position: relative;
        }
        .icon-btn {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 1px solid #2a2a3a;
            border-radius: 6px;
            background: #12121c;
            color: #aaa;
            cursor: pointer;
        }
        .icon-btn:hover {
            border-color: #00a8e0;
            color: #e0e0e0;
        }
        .settings-panel {
            display: none;
            position: absolute;
            top: 42px;
            right: 0;
            width: min(520px, calc(100vw - 40px));
            padding: 18px;
            background: #12121c;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
            z-index: 20;
        }
        .settings-panel.open {
            display: block;
        }
        .settings-panel-title {
            margin-bottom: 14px;
            color: #aaa;
            font-size: 14px;
            font-weight: 500;
        }
        .section {
            background: #12121c;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 16px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 9px 14px;
            border: 1px solid #2a2a3a;
            border-radius: 6px;
            background: #12121c;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
        }
        .tab-btn.active {
            border-color: #00a8e0;
            color: #fff;
            background: rgba(0, 168, 224, 0.18);
        }
        .view {
            display: none;
        }
        .view.active {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 10px 8px;
            font-size: 12px;
            font-weight: 500;
            color: #666;
            text-transform: uppercase;
            border-bottom: 1px solid #2a2a3a;
        }
        td {
            padding: 12px 8px;
            border-bottom: 1px solid #1a1a2a;
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .preset-num {
            width: 60px;
            font-weight: 600;
            color: #00a8e0;
        }
        .preset-status {
            width: 100px;
        }
        .preset-status .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }
        .badge-active {
            background: rgba(0, 168, 224, 0.2);
            color: #00a8e0;
        }
        .badge-inactive {
            background: rgba(255, 255, 255, 0.1);
            color: #666;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px 12px;
            background: #0a0a14;
            border: 1px solid #2a2a3a;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 13px;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #00a8e0;
        }
        input[type="text"].url-input {
            font-size: 12px;
            color: #888;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #00a8e0;
            color: #fff;
        }
        .btn-primary:hover {
            background: #0090c0;
        }
        .btn-secondary {
            background: #2a2a3a;
            color: #aaa;
        }
        .btn-secondary:hover {
            background: #3a3a4a;
        }
        .btn-small {
            padding: 6px 10px;
            font-size: 11px;
        }
        .actions {
            display: flex;
            gap: 6px;
            white-space: nowrap;
        }
        .add-form {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .add-form input {
            flex: 1;
            min-width: 150px;
        }
        .catalog-form {
            display: grid;
            grid-template-columns: 1.4fr 120px 150px 120px auto;
            gap: 8px;
            align-items: center;
        }
        select {
            width: 100%;
            padding: 8px 12px;
            background: #0a0a14;
            border: 1px solid #2a2a3a;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 13px;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 12px;
        }
        .footer a {
            color: #00a8e0;
            text-decoration: none;
        }
        .message {
            padding: 10px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .message-success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }
        .message-error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: #f44336;
        }
        .setup-status {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #2a2a3a;
            background: #12121c;
            font-size: 13px;
        }
        .setup-status-ok {
            border-color: rgba(76, 175, 80, 0.35);
            background: rgba(76, 175, 80, 0.12);
        }
        .setup-status-warning {
            border-color: rgba(244, 167, 54, 0.35);
            background: rgba(244, 167, 54, 0.12);
        }
        .setup-title {
            margin-bottom: 8px;
            color: #e0e0e0;
            font-weight: 600;
        }
        .setup-details {
            color: #aaa;
            line-height: 1.5;
        }
        .setup-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .setup-actions a {
            color: #fff;
            text-decoration: none;
        }
        .setup-device-list {
            margin-top: 10px;
            display: grid;
            gap: 8px;
        }
        .setup-device {
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.16);
        }
        .setup-device-title {
            color: #e0e0e0;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .setup-device-detail {
            color: #aaa;
            overflow-wrap: anywhere;
        }
        .spacer {
            height: 1px;
            background: #2a2a3a;
            margin: 20px 0;
        }
        .inline-form {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .inline-form .input-group {
            flex: 1;
            min-width: 200px;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(120px, 1fr));
            gap: 12px;
        }
        .field label {
            display: block;
            margin-bottom: 6px;
            color: #777;
            font-size: 12px;
            text-transform: uppercase;
        }
        .current-station {
            font-size: 11px;
            color: #555;
            margin-top: 4px;
        }
        .diagnostics {
            margin-top: 16px;
            padding: 14px;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            background: #0a0a14;
            font-size: 12px;
            color: #aaa;
        }
        .diagnostics-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 16px;
            margin-top: 10px;
        }
        .diagnostics-key {
            color: #666;
            text-transform: uppercase;
            font-size: 10px;
            margin-bottom: 3px;
        }
        .diagnostics-value {
            color: #ddd;
            overflow-wrap: anywhere;
        }
        .diagnostics-error {
            color: #f44336;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .status-card {
            padding: 12px;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            background: #0a0a14;
        }
        .status-card-label {
            color: #666;
            font-size: 10px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .status-card-value {
            color: #e0e0e0;
            font-size: 18px;
            font-weight: 500;
        }
        .settings-panel .btn {
            margin-top: 14px;
            width: 100%;
        }
        @media (max-width: 768px) {
            header {
                align-items: flex-start;
                gap: 12px;
            }
            .header-actions {
                flex-shrink: 0;
            }
            .actions {
                flex-direction: column;
            }
            td, th {
                padding: 8px 4px;
            }
            .url-input {
                display: none;
            }
            .settings-grid {
                grid-template-columns: 1fr;
            }
            .diagnostics-grid {
                grid-template-columns: 1fr;
            }
            .status-grid {
                grid-template-columns: 1fr 1fr;
            }
            .catalog-form {
                grid-template-columns: 1fr;
            }
        }
    </style>

<body>
    <div class="container">
        <header>
            <h1>SoundTouch Preset-Proxy</h1>
            <div class="header-actions">
                <div class="status">
                    <div class="status-dot"></div>
                    <span id="statusLabel"></span>
                </div>
                <div class="settings-menu">
                    <button class="icon-btn" onclick="toggleSettingsPanel()" id="settingsBtn">⚙</button>
                    <div id="settingsPanel" class="settings-panel">
                        <div class="settings-panel-title" id="streamSettingsTitle"></div>
                        <div class="settings-grid">
                            <div class="field">
                                <label for="bufferSeconds" id="bufferLabel"></label>
                                <input type="number" id="bufferSeconds" min="1" max="30" step="1">
                            </div>
                            <div class="field">
                                <label for="bitrateKbps" id="bitrateLabel"></label>
                                <input type="number" id="bitrateKbps" min="32" max="320" step="1">
                            </div>
                            <div class="field">
                                <label for="reconnectBackoffMs" id="reconnectLabel"></label>
                                <input type="text" id="reconnectBackoffMs" placeholder="250,500,1000,2000,3000">
                            </div>
                        </div>
                        <button class="btn btn-primary" onclick="saveSettings()" id="saveSettingsBtn"></button>
                    </div>
                </div>
            </div>
        </header>

        <div id="message"></div>
        <div id="setupStatus"></div>

        <div class="tabs">
            <button id="tabPresets" class="tab-btn active" onclick="showView('presets')"></button>
            <button id="tabCatalog" class="tab-btn" onclick="showView('catalog')"></button>
            <button id="tabStatus" class="tab-btn" onclick="showView('status')"></button>
        </div>

        <div id="presetsView" class="view active">
            <div class="section">
                <div class="section-title" id="assignStationTitle"></div>
                <div id="presetTable"></div>
            </div>

            <div class="section">
                <div class="section-title" id="addStationTitle"></div>
                <div class="add-form">
                    <input type="text" id="newStationName">
                    <input type="text" id="newStationDisplay">
                    <input type="text" id="newStationUrl" placeholder="Dispatcher URL">
                    <button class="btn btn-primary" onclick="addStation()" id="addStationBtn"></button>
                </div>
            </div>

            <div class="section">
                <div class="section-title" id="existingStationsTitle"></div>
                <div id="stationList"></div>
            </div>
        </div>

        <div id="catalogView" class="view">
            <div class="section">
                <div class="section-title" id="stationCatalogTitle"></div>
                <div class="catalog-form">
                    <input type="text" id="catalogQuery">
                    <select id="catalogCountry">
                        <option value="" id="optAllCountries"></option>
                        <option value="DE" id="optDE"></option>
                        <option value="AT" id="optAT"></option>
                        <option value="CH" id="optCH"></option>
                        <option value="GB">UK</option>
                        <option value="US">USA</option>
                        <option value="FR" id="optFR"></option>
                        <option value="IT" id="optIT"></option>
                        <option value="ES" id="optES"></option>
                        <option value="NL" id="optNL"></option>
                    </select>
                    <select id="catalogTag">
                        <option value="" id="optAllCategories"></option>
                        <option value="news">News</option>
                        <option value="talk">Talk</option>
                        <option value="pop">Pop</option>
                        <option value="rock">Rock</option>
                        <option value="jazz">Jazz</option>
                        <option value="classical" id="optClassical"></option>
                        <option value="electronic">Electronic</option>
                        <option value="80s">80s</option>
                        <option value="90s">90s</option>
                    </select>
                    <select id="catalogOrder">
                        <option value="clickcount" id="optPopular"></option>
                        <option value="votes">Votes</option>
                        <option value="bitrate">Bitrate</option>
                        <option value="name">Name</option>
                    </select>
                    <button class="btn btn-primary" onclick="searchCatalog()" id="searchBtn"></button>
                </div>
                <div id="catalogResults"></div>
            </div>
        </div>

        <div id="statusView" class="view">
            <div class="section">
                <div class="section-title" id="proxyStatusTitle"></div>
                <div id="proxyStatus"></div>
            </div>
        </div>

        <div class="footer">
            SoundTouch Preset-Proxy | <a href="/" onclick="location.reload(); return false;" id="reloadLink"></a>
        </div>
    </div>

    <script>
        let stations = [];
        let currentPresetMap = {};
        let settings = {};
        let diagnostics = null;
        let catalogResults = [];
        let proxyStatusTimer = null;
        let setupStatusTimer = null;

        function applyI18n() {
            document.getElementById('statusLabel').textContent = t.running;
            document.getElementById('settingsBtn').setAttribute('aria-label', t.settings);
            document.getElementById('settingsBtn').setAttribute('title', t.settings);
            document.getElementById('streamSettingsTitle').textContent = t.streamSettings;
            document.getElementById('bufferLabel').textContent = t.buffer;
            document.getElementById('bitrateLabel').textContent = t.bitrate;
            document.getElementById('reconnectLabel').textContent = t.reconnect;
            document.getElementById('saveSettingsBtn').textContent = t.save;
            document.getElementById('tabPresets').textContent = t.tabPresets;
            document.getElementById('tabCatalog').textContent = t.tabCatalog;
            document.getElementById('tabStatus').textContent = t.tabStatus;
            document.getElementById('assignStationTitle').textContent = t.assignStation;
            document.getElementById('addStationTitle').textContent = t.addStation;
            document.getElementById('addStationBtn').textContent = t.add;
            document.getElementById('existingStationsTitle').textContent = t.existingStations;
            document.getElementById('newStationName').placeholder = t.namePlaceholder;
            document.getElementById('newStationDisplay').placeholder = t.displayNamePlaceholder;
            document.getElementById('stationCatalogTitle').textContent = t.stationCatalog;
            document.getElementById('catalogQuery').placeholder = t.nameOrSearch;
            document.getElementById('optAllCountries').textContent = t.allCountries;
            document.getElementById('optDE').textContent = lang === 'de' ? 'Deutschland' : 'Germany';
            document.getElementById('optAT').textContent = lang === 'de' ? 'Österreich' : 'Austria';
            document.getElementById('optCH').textContent = lang === 'de' ? 'Schweiz' : 'Switzerland';
            document.getElementById('optFR').textContent = lang === 'de' ? 'Frankreich' : 'France';
            document.getElementById('optIT').textContent = lang === 'de' ? 'Italien' : 'Italy';
            document.getElementById('optES').textContent = lang === 'de' ? 'Spanien' : 'Spain';
            document.getElementById('optNL').textContent = lang === 'de' ? 'Niederlande' : 'Netherlands';
            document.getElementById('optAllCategories').textContent = t.allCategories;
            document.getElementById('optClassical').textContent = t.classical;
            document.getElementById('optPopular').textContent = t.popular;
            document.getElementById('searchBtn').textContent = t.search;
            document.getElementById('proxyStatusTitle').textContent = t.proxyStatus;
            document.getElementById('reloadLink').textContent = t.reload;
        }

        function showView(name) {
            document.getElementById('presetsView').classList.toggle('active', name === 'presets');
            document.getElementById('catalogView').classList.toggle('active', name === 'catalog');
            document.getElementById('statusView').classList.toggle('active', name === 'status');
            document.getElementById('tabPresets').classList.toggle('active', name === 'presets');
            document.getElementById('tabCatalog').classList.toggle('active', name === 'catalog');
            document.getElementById('tabStatus').classList.toggle('active', name === 'status');

            if (name === 'status') {
                loadProxyStatus();
                proxyStatusTimer = proxyStatusTimer || setInterval(loadProxyStatus, 3000);
            } else if (proxyStatusTimer) {
                clearInterval(proxyStatusTimer);
                proxyStatusTimer = null;
            }
        }

        async function loadStations() {
            try {
                const resp = await fetch('/api/stations');
                stations = await resp.json();
                buildPresetTable();
                buildStationList();
            } catch (e) {
                showMessage(t.errLoadStations, 'error');
            }
        }

        async function loadSettings() {
            try {
                const resp = await fetch('/api/settings');
                settings = await resp.json();
                document.getElementById('bufferSeconds').value = settings.bufferSeconds || 3;
                document.getElementById('bitrateKbps').value = settings.bitrateKbps || 128;
                document.getElementById('reconnectBackoffMs').value = (settings.reconnectBackoffMs || [250, 500, 1000, 2000, 3000]).join(',');
            } catch (e) {
                showMessage(t.errLoadSettings, 'error');
            }
        }

        async function loadSetupStatus() {
            try {
                const resp = await fetch('/api/setup/status');
                const data = await resp.json();
                renderSetupStatus(data);
            } catch (e) {
                document.getElementById('setupStatus').innerHTML = `
                    <div class="setup-status setup-status-warning">
                        <div class="setup-title">${t.setupStatusFail}</div>
                        <div class="setup-details">${t.setupStatusFailDetail}</div>
                    </div>
                `;
            }
        }

        function renderSetupStatus(data) {
            const el = document.getElementById('setupStatus');
            if (data.ready) {
                el.innerHTML = '';
                return;
            }

            const devices = Array.isArray(data.devices) && data.devices.length ? data.devices : [data];
            const deviceHtml = devices.map(device => {
                const reachable = !!device.speakerReachable;
                const migrated = !!device.migrated;
                const title = `${device.name || 'SoundTouch'} (${device.speakerIp || '-'})`;
                const state = reachable && migrated
                    ? 'OK'
                    : reachable
                        ? t.migrationRequired
                        : t.unreachable;
                const marge = device.currentMargeUrl || t.margeNotSet;
                const message = device.message || '-';
                const link = device.migrationUrl
                    ? `<a class="btn btn-primary btn-small" href="${escapeHtml(device.migrationUrl)}" target="_blank" rel="noreferrer">${t.openMigration}</a>`
                    : '';

                return `
                    <div class="setup-device">
                        <div class="setup-device-title">${escapeHtml(title)} - ${escapeHtml(state)}</div>
                        <div class="setup-device-detail">Marge: ${escapeHtml(marge)}</div>
                        ${reachable && !migrated ? `<div class="setup-device-detail">${t.expected}: ${escapeHtml(device.expectedMargeUrl || data.expectedMargeUrl || '-')}</div>` : ''}
                        ${!reachable ? `<div class="setup-device-detail">${escapeHtml(message)}</div>` : ''}
                        ${link ? `<div class="setup-actions">${link}</div>` : ''}
                    </div>
                `;
            }).join('');

            el.innerHTML = `
                <div class="setup-status setup-status-warning">
                    <div class="setup-title">${t.migrationBanner}</div>
                    <div class="setup-details">
                        ${t.migrationDetail}
                        <br>${t.migrationSsh}
                    </div>
                    <div class="setup-device-list">${deviceHtml}</div>
                    <div class="setup-actions">
                        <a class="btn btn-secondary btn-small" href="${escapeHtml(data.aftertouchUrl || '#')}" target="_blank" rel="noreferrer">${t.openAfterTouch}</a>
                    </div>
                </div>
            `;
        }

        async function saveSettings() {
            const bufferSeconds = parseInt(document.getElementById('bufferSeconds').value, 10);
            const bitrateKbps = parseInt(document.getElementById('bitrateKbps').value, 10);
            const reconnectBackoffMs = document.getElementById('reconnectBackoffMs').value
                .split(',')
                .map(v => parseInt(v.trim(), 10))
                .filter(v => Number.isFinite(v));

            if (!Number.isFinite(bufferSeconds) || !Number.isFinite(bitrateKbps) || reconnectBackoffMs.length === 0) {
                showMessage(t.errInvalidSettings, 'error');
                return;
            }

            try {
                const resp = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bufferSeconds, bitrateKbps, reconnectBackoffMs })
                });
                const data = await resp.json();
                if (data.status === 'ok') {
                    settings = data.settings;
                    document.getElementById('bufferSeconds').value = settings.bufferSeconds;
                    document.getElementById('bitrateKbps').value = settings.bitrateKbps;
                    document.getElementById('reconnectBackoffMs').value = settings.reconnectBackoffMs.join(',');
                    closeSettingsPanel();
                    showMessage(t.settingsSaved, 'success');
                } else {
                    showMessage(t.errSaveSettings, 'error');
                }
            } catch (e) {
                showMessage(t.errSaveSettings, 'error');
            }
        }

        function toggleSettingsPanel() {
            document.getElementById('settingsPanel').classList.toggle('open');
        }

        function closeSettingsPanel() {
            document.getElementById('settingsPanel').classList.remove('open');
        }

        document.addEventListener('click', (event) => {
            const menu = document.querySelector('.settings-menu');
            if (menu && !menu.contains(event.target)) {
                closeSettingsPanel();
            }
        });

        function buildPresetTable() {
            const slots = [1, 2, 3, 4, 5, 6];
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>${t.colPreset}</th>
                            <th>${t.colStation}</th>
                            <th>${t.colDispatcher}</th>
                            <th>${t.colStatus}</th>
                            <th>${t.colActions}</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            slots.forEach(slot => {
                const assignedStation = stations.find(s => s.presets && s.presets.includes(slot));
                const stationName = assignedStation ? assignedStation.name : '';
                const displayName = assignedStation ? assignedStation.displayName : '';
                const dispatcherUrl = assignedStation ? assignedStation.dispatcherUrl : '';

                html += `
                    <tr>
                        <td class="preset-num">${slot}</td>
                        <td>
                            <select id="station-select-${slot}" onchange="updatePresetSlot(${slot}, this.value)" style="width:100%;padding:8px;background:#0a0a14;border:1px solid #2a2a3a;border-radius:6px;color:#e0e0e0;font-size:13px;">
        <option value="">-- ${t.selectPlaceholder} --</option>
                                ${stations.map(s => `<option value="${s.name}" ${s.name === stationName ? 'selected' : ''}>${s.displayName || s.name}</option>`).join('')}
                            </select>
                        </td>
                        <td>
                            <input type="text" id="url-${slot}" class="url-input" value="${dispatcherUrl}" placeholder="Dispatcher URL" style="font-size:11px;color:#666;">
                        </td>
                        <td class="preset-status">
                            <span class="badge ${assignedStation ? 'badge-active' : 'badge-inactive'}">
                                ${assignedStation ? displayName || stationName : t.empty}
                            </span>
                        </td>
                        <td>
                            <div class="actions">
                                <button class="btn btn-primary btn-small" onclick="savePreset(${slot})">${t.saveBtnPreset}</button>
                                ${stationName ? `<button class="btn btn-secondary btn-small" onclick="testStream('${stationName}')">Test</button>` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            document.getElementById('presetTable').innerHTML = html;
        }

        function updatePresetSlot(slot, stationName) {
            if (stationName) {
                const station = stations.find(s => s.name === stationName);
                if (station) {
                    document.getElementById(`url-${slot}`).value = station.dispatcherUrl || '';
                }
            }
        }

        async function savePreset(slot) {
            const select = document.getElementById(`station-select-${slot}`);
            const stationName = select.value;
            if (!stationName) {
                showMessage(t.errSelectStation, 'error');
                return;
            }

            try {
                const resp = await fetch(`/api/stations/${stationName}/preset/${slot}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await resp.json();
                if (data.status === 'ok') {
                    showMessage(t.presetSet(slot, data.station), 'success');
                    loadStations();
                } else {
                    showMessage(`${t.error}: ${data.message || t.unknown}`, 'error');
                }
            } catch (e) {
                showMessage(t.errSavePreset, 'error');
            }
        }

        function testStream(stationName) {
            window.open(`/${stationName}`, '_blank');
        }

        async function searchCatalog() {
            const params = new URLSearchParams();
            const query = document.getElementById('catalogQuery').value.trim();
            const country = document.getElementById('catalogCountry').value;
            const tag = document.getElementById('catalogTag').value;
            const order = document.getElementById('catalogOrder').value;

            if (query) params.set('name', query);
            if (country) params.set('countrycode', country);
            if (tag) params.set('tag', tag);
            if (order) params.set('order', order);
            params.set('limit', '40');

            document.getElementById('catalogResults').innerHTML = `<div class="diagnostics">${t.searchingStations}</div>`;
            try {
                const resp = await fetch(`/api/catalog/search?${params.toString()}`);
                const data = await resp.json();
                if (data.status !== 'ok') {
                    showMessage(t.catalogError(data.message || t.unknown), 'error');
                    catalogResults = [];
                } else {
                    catalogResults = data.stations || [];
                }
                buildCatalogResults();
            } catch (e) {
                catalogResults = [];
                document.getElementById('catalogResults').innerHTML = `<div class="diagnostics diagnostics-error">${t.errLoadCatalog}</div>`;
            }
        }

        function buildCatalogResults() {
            if (catalogResults.length === 0) {
                document.getElementById('catalogResults').innerHTML = `<div class="diagnostics">${t.noStationsFound}</div>`;
                return;
            }

            let html = `
                <table style="margin-top:16px;">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>${t.colCountry}</th>
                            <th>Tags</th>
                            <th>Codec</th>
                            <th>Bitrate</th>
                            <th>${t.colActions}</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            catalogResults.forEach((station, index) => {
                html += `
                    <tr>
                        <td>${escapeHtml(station.name || '-')}</td>
                        <td>${escapeHtml(station.countrycode || station.country || '-')}</td>
                        <td style="font-size:11px;color:#666;max-width:260px;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(station.tags || '-')}</td>
                        <td>${escapeHtml(station.codec || '-')}</td>
                        <td>${station.bitrate || '-'}</td>
                        <td>
                            <div class="actions">
                                <button class="btn btn-secondary btn-small" onclick="previewCatalog(${index})">Test</button>
                                <button class="btn btn-primary btn-small" onclick="addCatalogStation(${index})">${t.add}</button>
                                <select id="catalog-preset-${index}" style="width:84px;font-size:11px;">
                                    <option value="">${t.colPreset}</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                </select>
                                <button class="btn btn-secondary btn-small" onclick="sendCatalogPreset(${index})">${t.setBtnPreset}</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            document.getElementById('catalogResults').innerHTML = html;
        }

        function previewCatalog(index) {
            const station = catalogResults[index];
            if (station && station.urlResolved) {
                window.open(station.urlResolved, '_blank');
            }
        }

        async function addCatalogStation(index, preset = null) {
            const station = catalogResults[index];
            if (!station) return null;

            const body = {
                name: station.name,
                displayName: station.name,
                dispatcherUrl: station.urlResolved || station.url
            };
            if (preset) body.preset = preset;

            const resp = await fetch('/api/catalog/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await resp.json();
            if (data.status === 'ok') {
                showMessage(preset ? t.stationSetToPreset(preset) : t.stationAddedSimple, 'success');
                loadStations();
            } else {
                showMessage(`${t.error}: ${data.message || t.errStationNotAdded}`, 'error');
            }
            return data;
        }

        function sendCatalogPreset(index) {
            const select = document.getElementById(`catalog-preset-${index}`);
            const preset = parseInt(select.value, 10);
            if (!Number.isFinite(preset)) {
                showMessage(t.errSelectPreset, 'error');
                return;
            }
            addCatalogStation(index, preset);
        }

        async function loadProxyStatus() {
            try {
                const resp = await fetch('/api/proxy/status');
                const data = await resp.json();
                renderProxyStatus(data);
            } catch (e) {
                document.getElementById('proxyStatus').innerHTML = `<div class="diagnostics diagnostics-error">${t.statusCouldNotLoad}</div>`;
            }
        }

        function renderProxyStatus(data) {
            const active = data.activeStreams || [];
            const stats = data.stationStats || [];
            const totalBytesOut = stats.reduce((sum, item) => sum + (item.bytesOut || 0), 0);
            const reconnects = [...active, ...stats].reduce((sum, item) => sum + (item.reconnects || 0), 0);
            const errors = stats.filter(item => item.lastError).length;

            let html = `
                <div class="status-grid">
                    ${statusCard(t.activeStreams, active.length)}
                    ${statusCard('Reconnects', reconnects)}
                    ${statusCard(t.colErrors, errors)}
                    ${statusCard(t.sent, formatBytes(totalBytesOut))}
                </div>
            `;

            html += `<div class="section-title">${t.current}</div>`;
            if (active.length === 0) {
                html += `<div class="diagnostics">${t.noActiveStreams}</div>`;
            } else {
                html += statusTable(active, true);
            }

            html += `<div class="section-title" style="margin-top:20px;">${t.recentStations}</div>`;
            if (stats.length === 0) {
                html += `<div class="diagnostics">${t.noStreamActivity}</div>`;
            } else {
                html += statusTable(stats, false);
            }

            document.getElementById('proxyStatus').innerHTML = html;
        }

        function statusCard(label, value) {
            return `
                <div class="status-card">
                    <div class="status-card-label">${escapeHtml(label)}</div>
                    <div class="status-card-value">${escapeHtml(String(value))}</div>
                </div>
            `;
        }

        function statusTable(items, active) {
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>${t.colStation}</th>
                            <th>${t.colStatus}</th>
                            <th>${active ? t.colDuration : t.started}</th>
                            ${active ? '' : `<th>${t.ended}</th><th>${t.duration}</th>`}
                            <th>Bytes</th>
                            <th>Reconnects</th>
                            <th>${t.colErrors}</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            items.forEach(item => {
                const startedStr = item.startedAt ? formatTimestamp(item.startedAt) : '-';
                const endedStr = item.endedAt ? formatTimestamp(item.endedAt) : '-';
                const durationStr = item.durationSeconds != null ? formatDuration(item.durationSeconds) : '-';
                html += `
                    <tr>
                        <td>${escapeHtml(item.station || '-')}</td>
                        <td>${escapeHtml(item.state || '-')}</td>
                        ${active
                            ? `<td>${durationStr}</td>`
                            : `<td>${startedStr}</td><td>${endedStr}</td><td>${durationStr}</td>`
                        }
                        <td>${formatBytes(item.bytesIn || 0)} ${t.bytesIn}, ${formatBytes(item.bytesOut || 0)} ${t.bytesOut}</td>
                        <td>${item.reconnects || 0}</td>
                        <td class="${item.lastError ? 'diagnostics-error' : ''}">${escapeHtml(item.lastError || '-')}</td>
                    </tr>
                `;
            });
            html += '</tbody></table>';
            return html;
        }

        function formatBytes(bytes) {
            if (bytes >= 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
            if (bytes >= 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${bytes} B`;
        }

        function formatDuration(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            if (mins > 0) return `${mins}m ${secs}s`;
            return `${secs}s`;
        }

        function formatTimestamp(unixSeconds) {
            const d = new Date(unixSeconds * 1000);
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }

        async function addStation() {
            const name = document.getElementById('newStationName').value.trim();
            const displayName = document.getElementById('newStationDisplay').value.trim();
            const url = document.getElementById('newStationUrl').value.trim();

            if (!name || !url) {
                showMessage(t.errNameUrl, 'error');
                return;
            }

            try {
                const resp = await fetch('/api/stations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        displayName: displayName || name,
                        dispatcherUrl: url,
                        presets: []
                    })
                });
                const data = await resp.json();
                if (data.status === 'ok') {
                    showMessage(t.stationAdded(name), 'success');
                    document.getElementById('newStationName').value = '';
                    document.getElementById('newStationDisplay').value = '';
                    document.getElementById('newStationUrl').value = '';
                    loadStations();
                } else {
                    showMessage(t.errAddStation, 'error');
                }
            } catch (e) {
                showMessage(t.errAddStation, 'error');
            }
        }

        function buildStationList() {
            if (stations.length === 0) {
                document.getElementById('stationList').innerHTML = `<p style="color:#666;font-size:13px;">${t.noStations}</p>`;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>${t.colDisplayName}</th>
                            <th>${t.colDispatcher}</th>
                            <th>${t.colPreset}s</th>
                            <th>${t.colActions}</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            stations.forEach(s => {
                html += `
                    <tr>
                        <td>${s.name}</td>
                        <td>${s.displayName || '-'}</td>
                        <td style="font-size:11px;color:#666;max-width:300px;overflow:hidden;text-overflow:ellipsis;">${s.dispatcherUrl}</td>
                        <td>${s.presets && s.presets.length > 0 ? s.presets.join(', ') : '-'}</td>
                        <td>
                            <div class="actions">
                                <button class="btn btn-secondary btn-small" onclick="testStream('${s.name}')">Test</button>
                                <button class="btn btn-secondary btn-small" onclick="loadDiagnostics('${s.name}')">Info</button>
                <button class="btn btn-secondary btn-small" onclick="deleteStation('${s.name}')">${t.deleteStation}</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table><div id="diagnosticsPanel"></div>';
            document.getElementById('stationList').innerHTML = html;
            renderDiagnostics();
        }

        async function loadDiagnostics(name) {
            diagnostics = { loading: true, station: name };
            renderDiagnostics();
            try {
                const resp = await fetch(`/api/stations/${name}/diagnostics`);
                diagnostics = await resp.json();
                renderDiagnostics();
            } catch (e) {
                diagnostics = { ok: false, station: name, message: t.diagCouldNotLoad };
                renderDiagnostics();
            }
        }

        function renderDiagnostics() {
            const panel = document.getElementById('diagnosticsPanel');
            if (!panel || !diagnostics) return;

            if (diagnostics.loading) {
                panel.innerHTML = `<div class="diagnostics">${t.analyzing(escapeHtml(diagnostics.station))}</div>`;
                return;
            }

            const headers = diagnostics.headers || {};
            const proxyStats = diagnostics.lastProxyStats || {};
            const bitrate = diagnostics.detectedBitrateKbps ? `${diagnostics.detectedBitrateKbps} kbps (${diagnostics.bitrateSource})` : t.unknown;
            const state = proxyStats.state || '-';
            const lastError = proxyStats.lastError || diagnostics.message || '-';
            const reconnects = proxyStats.reconnects || 0;
            const reconnectHistory = proxyStats.reconnectHistory || [];

            let reconnectSection = '';
            if (reconnects > 0 || reconnectHistory.length > 0) {
                let historyRows = reconnectHistory.length === 0
                    ? `<div style="color:#aaa;font-size:0.85em;padding:4px 0">${t.noReconnects}</div>`
                    : reconnectHistory.slice().reverse().map(ev => {
                        const timeStr = ev.at ? formatTimestamp(ev.at) : '-';
                        const reason = ev.reason || '-';
                        const backoff = ev.backoffSeconds != null ? `${ev.backoffSeconds}s` : '-';
                        return `<div style="display:grid;grid-template-columns:80px 1fr 60px;gap:4px;font-size:0.85em;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.06)">
                            <span style="color:#aaa">${escapeHtml(timeStr)}</span>
                            <span style="color:#f0c060;word-break:break-all">${escapeHtml(reason)}</span>
                            <span style="color:#aaa;text-align:right">+${escapeHtml(backoff)}</span>
                        </div>`;
                    }).join('');

                reconnectSection = `
                    <div style="margin-top:14px">
                        <div class="diagnostics-key" style="margin-bottom:6px">${t.reconnectHistory} (${reconnects})</div>
                        <div style="max-height:180px;overflow-y:auto">
                            <div style="display:grid;grid-template-columns:80px 1fr 60px;gap:4px;font-size:0.75em;color:#888;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:4px">
                                <span>${t.reconnectAt}</span><span>${t.reconnectReason}</span><span style="text-align:right">Backoff</span>
                            </div>
                            ${historyRows}
                        </div>
                    </div>`;
            }

            panel.innerHTML = `
                <div class="diagnostics">
                    <div class="${diagnostics.ok ? '' : 'diagnostics-error'}">
                        ${escapeHtml(diagnostics.displayName || diagnostics.station)}: ${diagnostics.ok ? t.streamReachable : t.error}
                    </div>
                    <div class="diagnostics-grid">
                        ${diagnosticItem('Status', diagnostics.status || '-')}
                        ${diagnosticItem('Bitrate', bitrate)}
                        ${diagnosticItem('Content-Type', diagnostics.contentType || headers['content-type'] || '-')}
                        ${diagnosticItem('ICY Name', headers['icy-name'] || '-')}
                        ${diagnosticItem('ICY Genre', headers['icy-genre'] || '-')}
                        ${diagnosticItem('ICY Metaint', headers['icy-metaint'] || '-')}
                        ${diagnosticItem('Sample', diagnostics.sampleBytes ? `${diagnostics.sampleBytes} Bytes in ${diagnostics.sampleDurationSeconds}s` : '-')}
                        ${diagnosticItem(t.proxyStatusLabel, state)}
                        ${diagnosticItem('Proxy Bytes', `${formatBytes(proxyStats.bytesIn || 0)} ${t.bytesIn}, ${formatBytes(proxyStats.bytesOut || 0)} ${t.bytesOut}`)}
                        ${diagnosticItem(t.lastError, lastError)}
                        ${diagnosticItem(t.resolvedUrl, diagnostics.resolvedUrl || '-')}
                        ${diagnosticItem('Dispatcher URL', diagnostics.dispatcherUrl || '-')}
                    </div>
                    ${reconnectSection}
                </div>
            `;
        }

        function diagnosticItem(label, value) {
            return `
                <div>
                    <div class="diagnostics-key">${label}</div>
                    <div class="diagnostics-value">${escapeHtml(String(value))}</div>
                </div>
            `;
        }

        function escapeHtml(value) {
            return value
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function deleteStation(name) {
            if (!confirm(t.confirmDelete(name))) return;
            try {
                const resp = await fetch(`/api/stations/${name}`, { method: 'DELETE' });
                const data = await resp.json();
                if (data.status === 'ok') {
                    showMessage(t.stationDeleted(name), 'success');
                    loadStations();
                } else {
                    showMessage(t.errDeleteStation, 'error');
                }
            } catch (e) {
                showMessage(t.errDeleteStation, 'error');
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.innerHTML = `<div class="message message-${type}">${text}</div>`;
            setTimeout(() => { msg.innerHTML = ''; }, 4000);
        }

        loadSettings();
        loadSetupStatus();
        setupStatusTimer = setInterval(loadSetupStatus, 30000);
        loadStations();
    </script>
</body>
</html>
