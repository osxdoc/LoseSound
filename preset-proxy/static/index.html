<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundTouch Preset-Proxy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a14;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #2a2a3a;
            position: relative;
        }
        h1 {
            font-size: 24px;
            font-weight: 500;
            color: #00a8e0;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #888;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .settings-menu {
            position: relative;
        }
        .icon-btn {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 1px solid #2a2a3a;
            border-radius: 6px;
            background: #12121c;
            color: #aaa;
            cursor: pointer;
        }
        .icon-btn:hover {
            border-color: #00a8e0;
            color: #e0e0e0;
        }
        .settings-panel {
            display: none;
            position: absolute;
            top: 42px;
            right: 0;
            width: min(520px, calc(100vw - 40px));
            padding: 18px;
            background: #12121c;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
            z-index: 20;
        }
        .settings-panel.open {
            display: block;
        }
        .settings-panel-title {
            margin-bottom: 14px;
            color: #aaa;
            font-size: 14px;
            font-weight: 500;
        }
        .section {
            background: #12121c;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 16px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 9px 14px;
            border: 1px solid #2a2a3a;
            border-radius: 6px;
            background: #12121c;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
        }
        .tab-btn.active {
            border-color: #00a8e0;
            color: #fff;
            background: rgba(0, 168, 224, 0.18);
        }
        .view {
            display: none;
        }
        .view.active {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 10px 8px;
            font-size: 12px;
            font-weight: 500;
            color: #666;
            text-transform: uppercase;
            border-bottom: 1px solid #2a2a3a;
        }
        td {
            padding: 12px 8px;
            border-bottom: 1px solid #1a1a2a;
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .preset-num {
            width: 60px;
            font-weight: 600;
            color: #00a8e0;
        }
        .preset-status {
            width: 100px;
        }
        .preset-status .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }
        .badge-active {
            background: rgba(0, 168, 224, 0.2);
            color: #00a8e0;
        }
        .badge-inactive {
            background: rgba(255, 255, 255, 0.1);
            color: #666;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px 12px;
            background: #0a0a14;
            border: 1px solid #2a2a3a;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 13px;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #00a8e0;
        }
        input[type="text"].url-input {
            font-size: 12px;
            color: #888;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #00a8e0;
            color: #fff;
        }
        .btn-primary:hover {
            background: #0090c0;
        }
        .btn-secondary {
            background: #2a2a3a;
            color: #aaa;
        }
        .btn-secondary:hover {
            background: #3a3a4a;
        }
        .btn-small {
            padding: 6px 10px;
            font-size: 11px;
        }
        .actions {
            display: flex;
            gap: 6px;
            white-space: nowrap;
        }
        .add-form {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .add-form input {
            flex: 1;
            min-width: 150px;
        }
        .catalog-form {
            display: grid;
            grid-template-columns: 1.4fr 120px 150px 120px auto;
            gap: 8px;
            align-items: center;
        }
        select {
            width: 100%;
            padding: 8px 12px;
            background: #0a0a14;
            border: 1px solid #2a2a3a;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 13px;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 12px;
        }
        .footer a {
            color: #00a8e0;
            text-decoration: none;
        }
        .message {
            padding: 10px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .message-success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }
        .message-error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: #f44336;
        }
        .spacer {
            height: 1px;
            background: #2a2a3a;
            margin: 20px 0;
        }
        .inline-form {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .inline-form .input-group {
            flex: 1;
            min-width: 200px;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(120px, 1fr));
            gap: 12px;
        }
        .field label {
            display: block;
            margin-bottom: 6px;
            color: #777;
            font-size: 12px;
            text-transform: uppercase;
        }
        .current-station {
            font-size: 11px;
            color: #555;
            margin-top: 4px;
        }
        .diagnostics {
            margin-top: 16px;
            padding: 14px;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            background: #0a0a14;
            font-size: 12px;
            color: #aaa;
        }
        .diagnostics-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 16px;
            margin-top: 10px;
        }
        .diagnostics-key {
            color: #666;
            text-transform: uppercase;
            font-size: 10px;
            margin-bottom: 3px;
        }
        .diagnostics-value {
            color: #ddd;
            overflow-wrap: anywhere;
        }
        .diagnostics-error {
            color: #f44336;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .status-card {
            padding: 12px;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            background: #0a0a14;
        }
        .status-card-label {
            color: #666;
            font-size: 10px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .status-card-value {
            color: #e0e0e0;
            font-size: 18px;
            font-weight: 500;
        }
        .settings-panel .btn {
            margin-top: 14px;
            width: 100%;
        }
        @media (max-width: 768px) {
            header {
                align-items: flex-start;
                gap: 12px;
            }
            .header-actions {
                flex-shrink: 0;
            }
            .actions {
                flex-direction: column;
            }
            td, th {
                padding: 8px 4px;
            }
            .url-input {
                display: none;
            }
            .settings-grid {
                grid-template-columns: 1fr;
            }
            .diagnostics-grid {
                grid-template-columns: 1fr;
            }
            .status-grid {
                grid-template-columns: 1fr 1fr;
            }
            .catalog-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SoundTouch Preset-Proxy</h1>
            <div class="header-actions">
                <div class="status">
                    <div class="status-dot"></div>
                    <span>Läuft</span>
                </div>
                <div class="settings-menu">
                    <button class="icon-btn" onclick="toggleSettingsPanel()" aria-label="Einstellungen" title="Einstellungen">⚙</button>
                    <div id="settingsPanel" class="settings-panel">
                        <div class="settings-panel-title">Stream-Einstellungen</div>
                        <div class="settings-grid">
                            <div class="field">
                                <label for="bufferSeconds">Puffer (s)</label>
                                <input type="number" id="bufferSeconds" min="1" max="30" step="1">
                            </div>
                            <div class="field">
                                <label for="bitrateKbps">Bitrate (kbps)</label>
                                <input type="number" id="bitrateKbps" min="32" max="320" step="1">
                            </div>
                            <div class="field">
                                <label for="reconnectBackoffMs">Reconnect (ms)</label>
                                <input type="text" id="reconnectBackoffMs" placeholder="250,500,1000,2000,3000">
                            </div>
                        </div>
                        <button class="btn btn-primary" onclick="saveSettings()">Speichern</button>
                    </div>
                </div>
            </div>
        </header>

        <div id="message"></div>

        <div class="tabs">
            <button id="tabPresets" class="tab-btn active" onclick="showView('presets')">Presets</button>
            <button id="tabCatalog" class="tab-btn" onclick="showView('catalog')">Sender suchen</button>
            <button id="tabStatus" class="tab-btn" onclick="showView('status')">Proxy Status</button>
        </div>

        <div id="presetsView" class="view active">
            <div class="section">
                <div class="section-title">Station einem Preset zuweisen</div>
                <div id="presetTable"></div>
            </div>

            <div class="section">
                <div class="section-title">Neue Station hinzufügen</div>
                <div class="add-form">
                    <input type="text" id="newStationName" placeholder="Name (z.B. hr3)">
                    <input type="text" id="newStationDisplay" placeholder="Anzeigename (z.B. HR3)">
                    <input type="text" id="newStationUrl" placeholder="Dispatcher URL">
                    <button class="btn btn-primary" onclick="addStation()">Hinzufügen</button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Vorhandene Stationen</div>
                <div id="stationList"></div>
            </div>
        </div>

        <div id="catalogView" class="view">
            <div class="section">
                <div class="section-title">Senderkatalog</div>
                <div class="catalog-form">
                    <input type="text" id="catalogQuery" placeholder="Name oder Suchbegriff">
                    <select id="catalogCountry">
                        <option value="">Alle Länder</option>
                        <option value="DE">Deutschland</option>
                        <option value="AT">Österreich</option>
                        <option value="CH">Schweiz</option>
                        <option value="GB">UK</option>
                        <option value="US">USA</option>
                        <option value="FR">Frankreich</option>
                        <option value="IT">Italien</option>
                        <option value="ES">Spanien</option>
                        <option value="NL">Niederlande</option>
                    </select>
                    <select id="catalogTag">
                        <option value="">Alle Kategorien</option>
                        <option value="news">News</option>
                        <option value="talk">Talk</option>
                        <option value="pop">Pop</option>
                        <option value="rock">Rock</option>
                        <option value="jazz">Jazz</option>
                        <option value="classical">Klassik</option>
                        <option value="electronic">Electronic</option>
                        <option value="80s">80s</option>
                        <option value="90s">90s</option>
                    </select>
                    <select id="catalogOrder">
                        <option value="clickcount">Beliebt</option>
                        <option value="votes">Votes</option>
                        <option value="bitrate">Bitrate</option>
                        <option value="name">Name</option>
                    </select>
                    <button class="btn btn-primary" onclick="searchCatalog()">Suchen</button>
                </div>
                <div id="catalogResults"></div>
            </div>
        </div>

        <div id="statusView" class="view">
            <div class="section">
                <div class="section-title">Proxy Status</div>
                <div id="proxyStatus"></div>
            </div>
        </div>

        <div class="footer">
            SoundTouch Preset-Proxy | <a href="/" onclick="location.reload(); return false;">Neu laden</a>
        </div>
    </div>

    <script>
        let stations = [];
        let currentPresetMap = {};
        let settings = {};
        let diagnostics = null;
        let catalogResults = [];
        let proxyStatusTimer = null;

        function showView(name) {
            document.getElementById('presetsView').classList.toggle('active', name === 'presets');
            document.getElementById('catalogView').classList.toggle('active', name === 'catalog');
            document.getElementById('statusView').classList.toggle('active', name === 'status');
            document.getElementById('tabPresets').classList.toggle('active', name === 'presets');
            document.getElementById('tabCatalog').classList.toggle('active', name === 'catalog');
            document.getElementById('tabStatus').classList.toggle('active', name === 'status');

            if (name === 'status') {
                loadProxyStatus();
                proxyStatusTimer = proxyStatusTimer || setInterval(loadProxyStatus, 3000);
            } else if (proxyStatusTimer) {
                clearInterval(proxyStatusTimer);
                proxyStatusTimer = null;
            }
        }

        async function loadStations() {
            try {
                const resp = await fetch('/api/stations');
                stations = await resp.json();
                buildPresetTable();
                buildStationList();
            } catch (e) {
                showMessage('Fehler beim Laden der Stationen', 'error');
            }
        }

        async function loadSettings() {
            try {
                const resp = await fetch('/api/settings');
                settings = await resp.json();
                document.getElementById('bufferSeconds').value = settings.bufferSeconds || 3;
                document.getElementById('bitrateKbps').value = settings.bitrateKbps || 128;
                document.getElementById('reconnectBackoffMs').value = (settings.reconnectBackoffMs || [250, 500, 1000, 2000, 3000]).join(',');
            } catch (e) {
                showMessage('Fehler beim Laden der Einstellungen', 'error');
            }
        }

        async function saveSettings() {
            const bufferSeconds = parseInt(document.getElementById('bufferSeconds').value, 10);
            const bitrateKbps = parseInt(document.getElementById('bitrateKbps').value, 10);
            const reconnectBackoffMs = document.getElementById('reconnectBackoffMs').value
                .split(',')
                .map(v => parseInt(v.trim(), 10))
                .filter(v => Number.isFinite(v));

            if (!Number.isFinite(bufferSeconds) || !Number.isFinite(bitrateKbps) || reconnectBackoffMs.length === 0) {
                showMessage('Bitte gültige Stream-Einstellungen eingeben', 'error');
                return;
            }

            try {
                const resp = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bufferSeconds, bitrateKbps, reconnectBackoffMs })
                });
                const data = await resp.json();
                if (data.status === 'ok') {
                    settings = data.settings;
                    document.getElementById('bufferSeconds').value = settings.bufferSeconds;
                    document.getElementById('bitrateKbps').value = settings.bitrateKbps;
                    document.getElementById('reconnectBackoffMs').value = settings.reconnectBackoffMs.join(',');
                    closeSettingsPanel();
                    showMessage('Einstellungen wurden gespeichert', 'success');
                } else {
                    showMessage('Fehler beim Speichern der Einstellungen', 'error');
                }
            } catch (e) {
                showMessage('Fehler beim Speichern der Einstellungen', 'error');
            }
        }

        function toggleSettingsPanel() {
            document.getElementById('settingsPanel').classList.toggle('open');
        }

        function closeSettingsPanel() {
            document.getElementById('settingsPanel').classList.remove('open');
        }

        document.addEventListener('click', (event) => {
            const menu = document.querySelector('.settings-menu');
            if (menu && !menu.contains(event.target)) {
                closeSettingsPanel();
            }
        });

        function buildPresetTable() {
            const slots = [1, 2, 3, 4, 5, 6];
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Preset</th>
                            <th>Station</th>
                            <th>Dispatcher URL</th>
                            <th>Status</th>
                            <th>Aktionen</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            slots.forEach(slot => {
                const assignedStation = stations.find(s => s.presets && s.presets.includes(slot));
                const stationName = assignedStation ? assignedStation.name : '';
                const displayName = assignedStation ? assignedStation.displayName : '';
                const dispatcherUrl = assignedStation ? assignedStation.dispatcherUrl : '';

                html += `
                    <tr>
                        <td class="preset-num">${slot}</td>
                        <td>
                            <select id="station-select-${slot}" onchange="updatePresetSlot(${slot}, this.value)" style="width:100%;padding:8px;background:#0a0a14;border:1px solid #2a2a3a;border-radius:6px;color:#e0e0e0;font-size:13px;">
                                <option value="">-- bitte wählen --</option>
                                ${stations.map(s => `<option value="${s.name}" ${s.name === stationName ? 'selected' : ''}>${s.displayName || s.name}</option>`).join('')}
                            </select>
                        </td>
                        <td>
                            <input type="text" id="url-${slot}" class="url-input" value="${dispatcherUrl}" placeholder="Dispatcher URL" style="font-size:11px;color:#666;">
                        </td>
                        <td class="preset-status">
                            <span class="badge ${assignedStation ? 'badge-active' : 'badge-inactive'}">
                                ${assignedStation ? displayName || stationName : 'Nicht belegt'}
                            </span>
                        </td>
                        <td>
                            <div class="actions">
                                <button class="btn btn-primary btn-small" onclick="savePreset(${slot})">Speichern</button>
                                ${stationName ? `<button class="btn btn-secondary btn-small" onclick="testStream('${stationName}')">Test</button>` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            document.getElementById('presetTable').innerHTML = html;
        }

        function updatePresetSlot(slot, stationName) {
            if (stationName) {
                const station = stations.find(s => s.name === stationName);
                if (station) {
                    document.getElementById(`url-${slot}`).value = station.dispatcherUrl || '';
                }
            }
        }

        async function savePreset(slot) {
            const select = document.getElementById(`station-select-${slot}`);
            const stationName = select.value;
            if (!stationName) {
                showMessage('Bitte erst eine Station auswählen', 'error');
                return;
            }

            try {
                const resp = await fetch(`/api/stations/${stationName}/preset/${slot}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await resp.json();
                if (data.status === 'ok') {
                    showMessage(`Preset ${slot} wurde auf ${data.station} gesetzt`, 'success');
                    loadStations();
                } else {
                    showMessage(`Fehler: ${data.message || 'Unbekannt'}`, 'error');
                }
            } catch (e) {
                showMessage('Fehler beim Speichern des Presets', 'error');
            }
        }

        function testStream(stationName) {
            window.open(`/${stationName}`, '_blank');
        }

        async function searchCatalog() {
            const params = new URLSearchParams();
            const query = document.getElementById('catalogQuery').value.trim();
            const country = document.getElementById('catalogCountry').value;
            const tag = document.getElementById('catalogTag').value;
            const order = document.getElementById('catalogOrder').value;

            if (query) params.set('name', query);
            if (country) params.set('countrycode', country);
            if (tag) params.set('tag', tag);
            if (order) params.set('order', order);
            params.set('limit', '40');

            document.getElementById('catalogResults').innerHTML = '<div class="diagnostics">Suche Sender ...</div>';
            try {
                const resp = await fetch(`/api/catalog/search?${params.toString()}`);
                const data = await resp.json();
                if (data.status !== 'ok') {
                    showMessage(`Katalogfehler: ${data.message || 'Unbekannt'}`, 'error');
                    catalogResults = [];
                } else {
                    catalogResults = data.stations || [];
                }
                buildCatalogResults();
            } catch (e) {
                catalogResults = [];
                document.getElementById('catalogResults').innerHTML = '<div class="diagnostics diagnostics-error">Katalog konnte nicht geladen werden.</div>';
            }
        }

        function buildCatalogResults() {
            if (catalogResults.length === 0) {
                document.getElementById('catalogResults').innerHTML = '<div class="diagnostics">Keine Sender gefunden.</div>';
                return;
            }

            let html = `
                <table style="margin-top:16px;">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Land</th>
                            <th>Tags</th>
                            <th>Codec</th>
                            <th>Bitrate</th>
                            <th>Aktionen</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            catalogResults.forEach((station, index) => {
                html += `
                    <tr>
                        <td>${escapeHtml(station.name || '-')}</td>
                        <td>${escapeHtml(station.countrycode || station.country || '-')}</td>
                        <td style="font-size:11px;color:#666;max-width:260px;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(station.tags || '-')}</td>
                        <td>${escapeHtml(station.codec || '-')}</td>
                        <td>${station.bitrate || '-'}</td>
                        <td>
                            <div class="actions">
                                <button class="btn btn-secondary btn-small" onclick="previewCatalog(${index})">Test</button>
                                <button class="btn btn-primary btn-small" onclick="addCatalogStation(${index})">Hinzufügen</button>
                                <select id="catalog-preset-${index}" style="width:84px;font-size:11px;">
                                    <option value="">Preset</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                </select>
                                <button class="btn btn-secondary btn-small" onclick="sendCatalogPreset(${index})">Setzen</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            document.getElementById('catalogResults').innerHTML = html;
        }

        function previewCatalog(index) {
            const station = catalogResults[index];
            if (station && station.urlResolved) {
                window.open(station.urlResolved, '_blank');
            }
        }

        async function addCatalogStation(index, preset = null) {
            const station = catalogResults[index];
            if (!station) return null;

            const body = {
                name: station.name,
                displayName: station.name,
                dispatcherUrl: station.urlResolved || station.url
            };
            if (preset) body.preset = preset;

            const resp = await fetch('/api/catalog/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await resp.json();
            if (data.status === 'ok') {
                showMessage(preset ? `Sender wurde auf Preset ${preset} gesetzt` : 'Sender wurde hinzugefügt', 'success');
                loadStations();
            } else {
                showMessage(`Fehler: ${data.message || 'Sender konnte nicht hinzugefügt werden'}`, 'error');
            }
            return data;
        }

        function sendCatalogPreset(index) {
            const select = document.getElementById(`catalog-preset-${index}`);
            const preset = parseInt(select.value, 10);
            if (!Number.isFinite(preset)) {
                showMessage('Bitte Preset auswählen', 'error');
                return;
            }
            addCatalogStation(index, preset);
        }

        async function loadProxyStatus() {
            try {
                const resp = await fetch('/api/proxy/status');
                const data = await resp.json();
                renderProxyStatus(data);
            } catch (e) {
                document.getElementById('proxyStatus').innerHTML = '<div class="diagnostics diagnostics-error">Status konnte nicht geladen werden.</div>';
            }
        }

        function renderProxyStatus(data) {
            const active = data.activeStreams || [];
            const stats = data.stationStats || [];
            const totalBytesOut = stats.reduce((sum, item) => sum + (item.bytesOut || 0), 0);
            const reconnects = [...active, ...stats].reduce((sum, item) => sum + (item.reconnects || 0), 0);
            const errors = stats.filter(item => item.lastError).length;

            let html = `
                <div class="status-grid">
                    ${statusCard('Aktive Streams', active.length)}
                    ${statusCard('Reconnects', reconnects)}
                    ${statusCard('Fehler', errors)}
                    ${statusCard('Gesendet', formatBytes(totalBytesOut))}
                </div>
            `;

            html += '<div class="section-title">Aktuell</div>';
            if (active.length === 0) {
                html += '<div class="diagnostics">Keine aktiven Streams.</div>';
            } else {
                html += statusTable(active, true);
            }

            html += '<div class="section-title" style="margin-top:20px;">Letzte Stationen</div>';
            if (stats.length === 0) {
                html += '<div class="diagnostics">Noch keine Stream-Aktivität.</div>';
            } else {
                html += statusTable(stats, false);
            }

            document.getElementById('proxyStatus').innerHTML = html;
        }

        function statusCard(label, value) {
            return `
                <div class="status-card">
                    <div class="status-card-label">${escapeHtml(label)}</div>
                    <div class="status-card-value">${escapeHtml(String(value))}</div>
                </div>
            `;
        }

        function statusTable(items, active) {
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Station</th>
                            <th>Status</th>
                            <th>Dauer</th>
                            <th>Bytes</th>
                            <th>Reconnects</th>
                            <th>Fehler</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            items.forEach(item => {
                html += `
                    <tr>
                        <td>${escapeHtml(item.station || '-')}</td>
                        <td>${escapeHtml(item.state || '-')}</td>
                        <td>${active ? formatDuration(item.durationSeconds || 0) : `${item.ageSeconds || 0}s her`}</td>
                        <td>${formatBytes(item.bytesIn || 0)} rein / ${formatBytes(item.bytesOut || 0)} raus</td>
                        <td>${item.reconnects || 0}</td>
                        <td class="${item.lastError ? 'diagnostics-error' : ''}">${escapeHtml(item.lastError || '-')}</td>
                    </tr>
                `;
            });
            html += '</tbody></table>';
            return html;
        }

        function formatBytes(bytes) {
            if (bytes >= 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
            if (bytes >= 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${bytes} B`;
        }

        function formatDuration(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            if (mins > 0) return `${mins}m ${secs}s`;
            return `${secs}s`;
        }

        async function addStation() {
            const name = document.getElementById('newStationName').value.trim();
            const displayName = document.getElementById('newStationDisplay').value.trim();
            const url = document.getElementById('newStationUrl').value.trim();

            if (!name || !url) {
                showMessage('Name und Dispatcher URL sind erforderlich', 'error');
                return;
            }

            try {
                const resp = await fetch('/api/stations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        displayName: displayName || name,
                        dispatcherUrl: url,
                        presets: []
                    })
                });
                const data = await resp.json();
                if (data.status === 'ok') {
                    showMessage(`Station "${name}" wurde hinzugefügt`, 'success');
                    document.getElementById('newStationName').value = '';
                    document.getElementById('newStationDisplay').value = '';
                    document.getElementById('newStationUrl').value = '';
                    loadStations();
                } else {
                    showMessage('Fehler beim Hinzufügen der Station', 'error');
                }
            } catch (e) {
                showMessage('Fehler beim Hinzufügen der Station', 'error');
            }
        }

        function buildStationList() {
            if (stations.length === 0) {
                document.getElementById('stationList').innerHTML = '<p style="color:#666;font-size:13px;">Noch keine Stationen vorhanden.</p>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Anzeigename</th>
                            <th>Dispatcher URL</th>
                            <th>Presets</th>
                            <th>Aktionen</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            stations.forEach(s => {
                html += `
                    <tr>
                        <td>${s.name}</td>
                        <td>${s.displayName || '-'}</td>
                        <td style="font-size:11px;color:#666;max-width:300px;overflow:hidden;text-overflow:ellipsis;">${s.dispatcherUrl}</td>
                        <td>${s.presets && s.presets.length > 0 ? s.presets.join(', ') : '-'}</td>
                        <td>
                            <div class="actions">
                                <button class="btn btn-secondary btn-small" onclick="testStream('${s.name}')">Test</button>
                                <button class="btn btn-secondary btn-small" onclick="loadDiagnostics('${s.name}')">Info</button>
                                <button class="btn btn-secondary btn-small" onclick="deleteStation('${s.name}')">Löschen</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table><div id="diagnosticsPanel"></div>';
            document.getElementById('stationList').innerHTML = html;
            renderDiagnostics();
        }

        async function loadDiagnostics(name) {
            diagnostics = { loading: true, station: name };
            renderDiagnostics();
            try {
                const resp = await fetch(`/api/stations/${name}/diagnostics`);
                diagnostics = await resp.json();
                renderDiagnostics();
            } catch (e) {
                diagnostics = { ok: false, station: name, message: 'Diagnose konnte nicht geladen werden' };
                renderDiagnostics();
            }
        }

        function renderDiagnostics() {
            const panel = document.getElementById('diagnosticsPanel');
            if (!panel || !diagnostics) return;

            if (diagnostics.loading) {
                panel.innerHTML = `<div class="diagnostics">Analysiere ${escapeHtml(diagnostics.station)} ...</div>`;
                return;
            }

            const headers = diagnostics.headers || {};
            const proxyStats = diagnostics.lastProxyStats || {};
            const bitrate = diagnostics.detectedBitrateKbps ? `${diagnostics.detectedBitrateKbps} kbps (${diagnostics.bitrateSource})` : 'Unbekannt';
            const state = proxyStats.state || '-';
            const lastError = proxyStats.lastError || diagnostics.message || '-';

            panel.innerHTML = `
                <div class="diagnostics">
                    <div class="${diagnostics.ok ? '' : 'diagnostics-error'}">
                        ${escapeHtml(diagnostics.displayName || diagnostics.station)}: ${diagnostics.ok ? 'Stream erreichbar' : 'Fehler'}
                    </div>
                    <div class="diagnostics-grid">
                        ${diagnosticItem('Status', diagnostics.status || '-')}
                        ${diagnosticItem('Bitrate', bitrate)}
                        ${diagnosticItem('Content-Type', diagnostics.contentType || headers['content-type'] || '-')}
                        ${diagnosticItem('ICY Name', headers['icy-name'] || '-')}
                        ${diagnosticItem('ICY Genre', headers['icy-genre'] || '-')}
                        ${diagnosticItem('ICY Metaint', headers['icy-metaint'] || '-')}
                        ${diagnosticItem('Sample', diagnostics.sampleBytes ? `${diagnostics.sampleBytes} Bytes in ${diagnostics.sampleDurationSeconds}s` : '-')}
                        ${diagnosticItem('Proxy Status', state)}
                        ${diagnosticItem('Proxy Bytes', `${proxyStats.bytesIn || 0} rein / ${proxyStats.bytesOut || 0} raus`)}
                        ${diagnosticItem('Letzter Fehler', lastError)}
                        ${diagnosticItem('Aufgelöste URL', diagnostics.resolvedUrl || '-')}
                        ${diagnosticItem('Dispatcher URL', diagnostics.dispatcherUrl || '-')}
                    </div>
                </div>
            `;
        }

        function diagnosticItem(label, value) {
            return `
                <div>
                    <div class="diagnostics-key">${label}</div>
                    <div class="diagnostics-value">${escapeHtml(String(value))}</div>
                </div>
            `;
        }

        function escapeHtml(value) {
            return value
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function deleteStation(name) {
            if (!confirm(`Station "${name}" wirklich löschen?`)) return;
            try {
                const resp = await fetch(`/api/stations/${name}`, { method: 'DELETE' });
                const data = await resp.json();
                if (data.status === 'ok') {
                    showMessage(`Station "${name}" wurde gelöscht`, 'success');
                    loadStations();
                } else {
                    showMessage('Fehler beim Löschen', 'error');
                }
            } catch (e) {
                showMessage('Fehler beim Löschen', 'error');
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.innerHTML = `<div class="message message-${type}">${text}</div>`;
            setTimeout(() => { msg.innerHTML = ''; }, 4000);
        }

        loadSettings();
        loadStations();
    </script>
</body>
</html>
